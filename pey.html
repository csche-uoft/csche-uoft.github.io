<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PEY Co-op | CSChE UofT</title>
  <link rel="icon" type="image/png" href="images/logochat.png">
  <link rel="stylesheet" href="style.css" />
  <script src="main.js" defer></script>
  <style>
    #searchInput {
      width: 100%; padding: 12px;
      border: 2px solid #ddd; border-radius: 4px;
      font-size: 1rem; margin-bottom: 1rem;
    }
    #searchInput:focus { border-color: var(--primary); outline: none; }
  </style>
</head>
<body>
  <csche-header></csche-header>

  <main class="container">
    <section>
      <h2>PEY Salary Database</h2>
      <p>Search past internship data to help negotiate your salary or choose your path.</p>
      
      <input type="text" id="searchInput" placeholder="Search by company, title, or year..." />
      
      <div style="overflow-x: auto;">
        <table id="internshipTable" class="pd-table">
          <thead>
            <tr>
              <th>Company</th><th>Year</th><th>Location</th><th>Industry</th><th>Title</th><th>Salary (k)</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>

  <csche-footer></csche-footer>

  <script>
    const publicSpreadsheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTHSQajCZ5u2pbmlu9OhGlVhDq6B0PkPB_NGiCG9ItllrUWhCfJlg0tVn7_MNFMz-qdbDH-Z1dxs60i/pub?output=csv';

    async function loadCSV() {
      try {
        const response = await fetch(publicSpreadsheetUrl);
        const csvText = await response.text();
        // Simple CSV parser (robust enough for this data)
        const rows = csvText.trim().split('\n').map(row => row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/));
        const tableBody = document.querySelector('#internshipTable tbody');
        
        // Skip header row (i=1)
        for (let i = 1; i < rows.length; i++) {
          const tr = document.createElement('tr');
          rows[i].forEach(cell => {
            const td = document.createElement('td');
            td.textContent = cell.replace(/^"|"$/g, '');
            tr.appendChild(td);
          });
          tableBody.appendChild(tr);
        }
      } catch (error) { console.error('Error loading CSV:', error); }
    }
    loadCSV();

    document.getElementById('searchInput').addEventListener('input', (e) => {
      const filter = e.target.value.toLowerCase();
      document.querySelectorAll('#internshipTable tbody tr').forEach(row => {
        row.style.display = row.textContent.toLowerCase().includes(filter) ? '' : 'none';
      });
    });
  </script>
</body>
</html>
